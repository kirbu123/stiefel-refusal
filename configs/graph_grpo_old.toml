[model]
name = "deepseek-ai/DeepSeek-R1-Distill-Qwen-7B"
batch_size = 16
max_response_length = 2048
system_prompt = "You are a helpful assistant."

[data]
graph_file = "graph_build/Physical harm_graph.txt"

[grpo]
n_groups = 4
n_epochs = 50
learning_rate = 1e-3
noise_scale = 1.0
beta = 0.1
gradient_scale = 1e6

[abliteration]
max_weight = 2.0
max_weight_position = 0.7
min_weight = 0.1
min_weight_distance = 0.3

[weights]
init_type = "zero"

[evaluation]
backend = "local_llm_judge"
evaluate_locality = true
judge_api_url = "http://localhost:31181/v1/chat/completions"
classifier_api_url = "http://localhost:31180/v1/chat/completions"
llamaguard_model_name = "meta-llama/Meta-Llama-Guard-2-8B"
llamaguard_device = "cuda"
llamaguard_dtype = "bfloat16"

[mmlu]
enabled = true
dataset = "cais/mmlu"
subset = "all"
split = "test"
mode = "zero_shot"
answer_mode = "generate"
n_shots = 0
sample_size = 100
sample_seed = 42
max_new_tokens = 2048
store_predictions = true

[benchmarks]
enabled = []

[benchmarks.jailbreakbench]
judge_mode = "project"
max_samples = 100
categories = []
harmful_score_threshold = 3

[benchmarks.harmbench]
judge_mode = "official"
split = "test"
max_samples = 0
categories = []
functional_categories = []
semantic_categories = []
harmful_score_threshold = 3

[benchmarks.harmbench.official_classifier]
model_name = "cais/HarmBench-Llama-2-13b-cls"
batch_size = 8
device = "cuda"
dtype = "bfloat16"
